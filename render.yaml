services:
  - type: web
    name: miami-real-estate-ml
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 0 --bind 0.0.0.0:10000 "src.05_build_dashboard:app.server"
    envVars:
      - key: PORT
        value: 10000
